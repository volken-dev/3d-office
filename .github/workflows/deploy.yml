name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Turborepo and Next.js builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install
        run: bun install --frozen-lockfile

      # bun audit has no production-only mode. GHSA-vfj7-8cjw-p6xm (braces) only reaches
      # eslint-config-next at lint time and has no patched release yet.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Static export to apps/web/out; the web postbuild step injects the CSP meta tag.
      - name: Build
        run: bun run build

      - name: Guard against leaked API keys
        run: |
          if grep -rEl 'AIza[0-9A-Za-z_-]{35}' apps/web/out/; then
            echo "A Google API key was found in the build output." >&2
            exit 1
          fi

      # The deploy-pages artifact flow skips Jekyll, so _next/ is served without a .nojekyll file.
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./apps/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
